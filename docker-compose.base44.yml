# Base44 sandbox environment for the "Quiz de Culture Générale" project.
#
# The project is a dependency-free static site (index.html + style.css + script.js),
# so there is nothing to install: a plain node image serves the bind-mounted source
# with live reload. Edit any of those files and the preview refreshes.
#
# Usage: docker compose -f docker-compose.base44.yml up -d
name: quiz-culture-generale

services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Source is bind-mounted (not baked into an image) so edits are served live.
    command: ["node", ".base44/dev-server.mjs"]
    labels:
      base44.project: "Quiz Culture Générale"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      - PORT=3000
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:3000/ &&
          wget -q -O /dev/null http://127.0.0.1:3000/script.js ||
          (echo "app not serving" >&2; exit 1)
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
